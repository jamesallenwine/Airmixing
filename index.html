--paper: #FFFFFF;
--surface: #F2F2F2;
--surface-2: #F8F9FA;

/* Text */
--ink: #1A1A1A;
--ink-2: #3D4852;
--muted: #6E7781;

/* Lines */
--line: #E1E4E8;
--line-soft: #EEF0F2;

/* Type */
--font-heading: 'Open Sans', sans-serif;

}

- { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
background: var(–surface);
color: var(–ink);
font-family: var(–font-body);
font-size: 14px;
line-height: 1.5;
-webkit-font-smoothing: antialiased;
}

body { min-height: 100vh; }

/* HEADER */
.header {
background: white;
border-bottom: 1px solid var(–line);
box-shadow: 0 1px 0 rgba(0,0,0,0.02);
}
.header-inner {
max-width: 1400px;
margin: 0 auto;
padding: 18px 28px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 24px;
flex-wrap: wrap;
}
.brand {
display: flex;
flex-direction: column;
gap: 2px;
}
.brand-logo {
height: 48px;
width: auto;
display: block;
}
.brand-tag {
font-family: var(–font-heading);
font-size: 10px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.18em;
color: var(–teal-deep);
margin-top: 8px;
padding-left: 2px;
}
.header-title {
font-family: var(–font-heading);
font-size: 14px;
font-weight: 500;
color: var(–ink-2);
text-align: center;
flex: 1;
min-width: 200px;
}
.project-input {
background: white;
border: 1px solid var(–line);
color: var(–ink);
padding: 9px 14px;
border-radius: 4px;
font-family: var(–font-body);
font-size: 13px;
width: 240px;
max-width: 100%;
transition: all 0.15s ease;
}
.project-input::placeholder { color: var(–muted); }
.project-input:focus {
outline: none;
border-color: var(–blue);
box-shadow: 0 0 0 3px rgba(0,118,189,0.12);
}

/* LAYOUT */
.container {
max-width: 1400px;
margin: 0 auto;
padding: 28px;
display: grid;
grid-template-columns: 360px 1fr;
gap: 28px;
}
/* Tablet: stack configurator above recipe */
@media (max-width: 1100px) {
.container { grid-template-columns: 1fr; padding: 20px; gap: 20px; }
}
@media (max-width: 720px) {
.container { padding: 14px; gap: 14px; }
.header-inner { padding: 14px 18px; gap: 12px; }
.header-title { display: none; }
.project-input { min-width: 0; flex: 1; }
}

.accent-block {
position: relative;
padding-left: 14px;
}
.accent-block::before {
content: ‘’;
position: absolute;
left: 0;
top: 4px;
bottom: 4px;
width: 4px;
background: var(–teal);
border-radius: 2px;
}

/* CONFIGURATOR */
.configurator {
background: white;
border: 1px solid var(–line);
border-radius: 6px;
padding: 24px;
align-self: start;
}

.config-title {
font-family: var(–font-heading);
font-size: 16px;
font-weight: 700;
color: var(–blue-deep);
margin-bottom: 2px;
text-transform: uppercase;
letter-spacing: 0.04em;
}
.config-sub {
font-size: 11px;
color: var(–muted);
margin-bottom: 22px;
text-transform: uppercase;
letter-spacing: 0.12em;
font-family: var(–font-heading);
font-weight: 500;
}

.field { margin-bottom: 20px; }
.label {
display: block;
font-family: var(–font-heading);
font-size: 11px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.08em;
color: var(–ink-2);
margin-bottom: 8px;
}
.select, .text-input {
width: 100%;
padding: 10px 12px;
border: 1px solid var(–line);
border-radius: 4px;
background: white;
font-family: var(–font-body);
font-size: 14px;
color: var(–ink);
transition: border-color 0.15s;
}
.select:focus, .text-input:focus {
outline: none;
border-color: var(–blue);
box-shadow: 0 0 0 3px rgba(0,118,189,0.12);
}

/* SEGMENTED CONTROL */
.segmented {
display: grid;
grid-template-columns: repeat(3, 1fr);
background: var(–surface);
border: 1px solid var(–line);
border-radius: 4px;
padding: 3px;
gap: 2px;
}
.seg-btn {
border: none;
background: transparent;
padding: 9px 6px;
font-family: var(–font-heading);
font-size: 12px;
font-weight: 600;
color: var(–muted);
cursor: pointer;
border-radius: 3px;
transition: all 0.15s;
text-transform: uppercase;
letter-spacing: 0.04em;
}
.seg-btn:hover { color: var(–blue-deep); }
.seg-btn.active {
background-color: #0076BD;
color: white;
box-shadow: 0 1px 2px rgba(0,118,189,0.25);
}

/* TANK STATS */
.tank-stats {
background: var(–surface-2);
border: 1px solid var(–line);
border-radius: 4px;
padding: 14px;
margin-top: 10px;
}
.tank-stat-row {
display: flex;
justify-content: space-between;
align-items: baseline;
padding: 4px 0;
font-size: 13px;
}
.tank-stat-row + .tank-stat-row { border-top: 1px solid var(–line-soft); margin-top: 4px; padding-top: 8px; }
.tank-stat-label {
color: var(–muted);
font-size: 11px;
text-transform: uppercase;
letter-spacing: 0.06em;
font-family: var(–font-heading);
font-weight: 500;
}
.tank-stat-val { font-family: var(–font-mono); font-weight: 500; color: var(–blue-deep); font-size: 13px; }

/* RECIPE HEADER */
.recipe-header {
display: flex;
justify-content: space-between;
align-items: flex-end;
margin-bottom: 18px;
padding-bottom: 16px;
border-bottom: 1px solid var(–line);
gap: 16px;
flex-wrap: wrap;
}
.recipe-title {
font-family: var(–font-heading);
font-size: 22px;
font-weight: 700;
color: var(–blue-deep);
line-height: 1.15;
letter-spacing: -0.01em;
}
.recipe-subtitle {
font-size: 13px;
color: var(–muted);
margin-top: 6px;
font-family: var(–font-body);
}
.summary-stats {
display: flex;
gap: 22px;
flex-wrap: wrap;
}
@media (max-width: 600px) {
.summary-stats { gap: 14px; }
.recipe-title { font-size: 19px; }
}
.stat {
text-align: right;
}
.stat-label {
font-family: var(–font-heading);
font-size: 10px;
text-transform: uppercase;
letter-spacing: 0.1em;
color: var(–muted);
font-weight: 600;
}
.stat-value {
font-family: var(–font-heading);
font-size: 22px;
font-weight: 700;
color: var(–blue);
margin-top: 4px;
line-height: 1;
}
.stat-value .unit {
font-size: 12px;
color: var(–muted);
font-weight: 500;
margin-left: 3px;
font-family: var(–font-body);
}

/* TIMELINE */
.timeline {
display: grid;
grid-template-columns: repeat(6, 1fr);
gap: 6px;
margin-bottom: 20px;
padding: 14px;
background: white;
border: 1px solid var(–line);
border-radius: 4px;
}
@media (max-width: 600px) {
.timeline { grid-template-columns: repeat(3, 1fr); gap: 10px; }
}
.timeline-bar {
height: 6px;
background: var(–surface);
border-radius: 3px;
overflow: hidden;
}
.timeline-fill {
height: 100%;
background: linear-gradient(90deg, var(–teal), var(–blue));
border-radius: 3px;
}
.timeline-label {
font-family: var(–font-heading);
font-size: 9px;
text-transform: uppercase;
letter-spacing: 0.08em;
color: var(–ink-2);
margin-top: 7px;
text-align: center;
font-weight: 600;
}
.timeline-hours {
font-family: var(–font-mono);
font-size: 11px;
color: var(–blue-deep);
text-align: center;
margin-top: 2px;
font-weight: 500;
}

/* PHASE CARDS */
.phases {
display: grid;
gap: 12px;
}
.phase {
background: white;
border: 1px solid var(–line);
border-radius: 6px;
overflow: hidden;
transition: all 0.2s;
}
.phase.modified {
border-color: var(–teal);
box-shadow: 0 0 0 3px rgba(78,191,179,0.12);
}
.phase-head {
display: flex;
align-items: center;
gap: 14px;
padding: 13px 18px;
background-color: #0076BD;
color: white;
min-height: 52px;
flex-wrap: wrap;
}
.phase-num {
font-family: var(–font-heading);
font-size: 22px;
font-weight: 800;
color: white;
line-height: 1;
min-width: 32px;
opacity: 0.4;
}
.phase-name-block { flex: 1; }
.phase-name {
font-family: var(–font-heading);
font-size: 16px;
font-weight: 700;
letter-spacing: -0.005em;
}
.phase-meta {
font-family: var(–font-heading);
font-size: 10px;
color: rgba(255,255,255,0.7);
text-transform: uppercase;
letter-spacing: 0.12em;
margin-top: 2px;
font-weight: 500;
}
.phase-modified-badge {
background: var(–teal);
color: white;
font-family: var(–font-heading);
font-size: 9px;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.1em;
padding: 4px 8px;
border-radius: 3px;
margin-right: 6px;
}
.phase-reset {
background: rgba(255,255,255,0.15);
border: 1px solid rgba(255,255,255,0.25);
color: white;
padding: 5px 10px;
border-radius: 3px;
font-size: 11px;
font-family: var(–font-body);
font-weight: 500;
cursor: pointer;
transition: all 0.15s;
}
.phase-reset:hover { background: rgba(255,255,255,0.25); }

.phase-body {
display: grid;
grid-template-columns: repeat(5, 1fr);
gap: 0;
}
/* Tablet portrait: 3 columns */
@media (max-width: 1100px) {
.phase-body { grid-template-columns: repeat(3, 1fr); }
.phase-cell:nth-child(3n) { border-right: none; }
}
/* Phone: 2 columns */
@media (max-width: 600px) {
.phase-body { grid-template-columns: repeat(2, 1fr); }
.phase-cell:nth-child(3n) { border-right: 1px solid var(–line-soft); }
.phase-cell:nth-child(2n) { border-right: none; }
}

.phase-cell {
padding: 14px;
border-right: 1px solid var(–line-soft);
border-bottom: 1px solid var(–line-soft);
}
.phase-cell:last-child { border-right: none; }

.cell-label {
font-family: var(–font-heading);
font-size: 10px;
text-transform: uppercase;
letter-spacing: 0.08em;
color: var(–muted);
font-weight: 600;
margin-bottom: 6px;
}
.cell-input {
font-family: var(–font-mono);
font-size: 15px;
font-weight: 500;
color: var(–blue-deep);
background: var(–surface-2);
border: 1px solid var(–line);
border-radius: 3px;
padding: 6px 8px;
width: 100%;
transition: all 0.15s;
}
.cell-input:focus {
outline: none;
border-color: var(–blue);
background: white;
box-shadow: 0 0 0 3px rgba(0,118,189,0.12);
}
.cell-suffix {
font-size: 10px;
color: var(–muted);
margin-top: 4px;
font-family: var(–font-body);
}

/* INTENSITY BUTTONS */
.intensity-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 3px;
}
.intensity-btn {
border: 1px solid var(–line);
background: var(–surface-2);
padding: 6px 4px;
border-radius: 3px;
font-family: var(–font-heading);
font-size: 10px;
font-weight: 600;
cursor: pointer;
color: var(–muted);
text-transform: uppercase;
letter-spacing: 0.04em;
transition: all 0.15s;
}
.intensity-btn:hover {
border-color: var(–blue);
color: var(–blue-deep);
}
.intensity-btn.active {
background: var(–teal);
border-color: var(–teal);
color: white;
}
.intensity-btn[data-level=“Intense”].active {
background: var(–red);
border-color: var(–red);
}

/* FOOTER ACTIONS */
.actions {
display: flex;
gap: 10px;
margin-top: 24px;
padding-top: 20px;
border-top: 1px solid var(–line);
flex-wrap: wrap;
}
@media (max-width: 600px) {
.actions .btn { flex: 1 1 100%; }
.btn-danger { margin-left: 0; }
}
.btn {
padding: 11px 20px;
border-radius: 4px;
font-family: var(–font-heading);
font-size: 12px;
font-weight: 600;
cursor: pointer;
border: 1px solid transparent;
transition: all 0.15s;
text-transform: uppercase;
letter-spacing: 0.04em;
}
.btn-primary {
background: var(–blue);
color: white;
border-color: var(–blue);
}
.btn-primary:hover { background: var(–blue-deep); border-color: var(–blue-deep); }
.btn-secondary {
background: white;
color: var(–blue);
border-color: var(–blue);
}
.btn-secondary:hover { background: var(–blue-soft); }
.btn-danger {
background: white;
color: var(–red);
border-color: var(–line);
margin-left: auto;
}
.btn-danger:hover { background: var(–red); color: white; border-color: var(–red); }

/* TOAST */
.toast {
position: fixed;
bottom: 24px;
left: 50%;
transform: translateX(-50%);
background: var(–blue-deep);
color: white;
padding: 12px 24px;
border-radius: 4px;
font-family: var(–font-body);
font-size: 13px;
font-weight: 500;
box-shadow: 0 4px 12px rgba(21,78,133,0.25);
z-index: 1000;
animation: toastIn 0.2s ease;
}
@keyframes toastIn {
from { opacity: 0; transform: translateX(-50%) translateY(8px); }
to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* DOC FOOTER */
.doc-footer {
text-align: center;
padding: 32px 24px 40px;
color: var(–muted);
font-size: 12px;
border-top: 1px solid var(–line);
margin-top: 40px;
background: white;
}
.doc-footer .accent-text {
font-family: var(–font-heading);
font-weight: 700;
color: var(–blue-deep);
}
.doc-footer .winegrid-tease {
margin-top: 8px;
font-style: italic;
color: var(–teal-deep);
font-family: var(–font-body);
}

/* PRINT */
@media print {
@page { size: letter; margin: 0.5in; }
body { background: white; }
.header { box-shadow: none; border-bottom: 2px solid var(–blue); }
.header-inner { padding: 0 0 12px 0; }
.brand-logo { height: 36px; }
.project-input { background: transparent; border: none; padding: 0; min-width: auto; }
.header-title { display: none; }
.configurator, .actions, .phase-reset, .phase-modified-badge, .toast { display: none !important; }
.container { display: block; padding: 0; max-width: none; }
.recipe-header { page-break-after: avoid; }
.timeline { border: 1px solid #888; }
.phase {
page-break-inside: avoid;
border: 1px solid #888;
margin-bottom: 8px;
}
.phase-head {
background: white !important;
color: var(–blue-deep) !important;
border-bottom: 1px solid #888;
}
.phase-num { color: var(–red) !important; opacity: 1 !important; }
.phase-name { color: var(–blue-deep) !important; }
.phase-meta { color: #666 !important; }
.cell-input {
background: white;
border: none;
padding: 0;
font-size: 13px;
}
.intensity-btn { display: none; }
.intensity-btn.active {
display: block;
background: white !important;
color: var(–blue-deep) !important;
border: 1px solid var(–blue) !important;
font-weight: 700;
}
.doc-footer { display: block; border-top: 1px solid #888; padding-top: 12px; margin-top: 24px; background: none; }
.winegrid-tease { display: none; }
.print-only { display: block !important; }
}
.print-only { display: none; }
.print-only.signature {
margin-top: 20px;
display: flex;
gap: 40px;
font-size: 12px;
}
.signature-line {
flex: 1;
border-top: 1px solid #888;
padding-top: 4px;
font-family: var(–font-heading);
font-size: 10px;
text-transform: uppercase;
letter-spacing: 0.08em;
color: var(–muted);
}

</style>
